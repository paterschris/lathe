name: Report a crash
description: Lathe is crashing or freezing or hanging.
labels: "state:needs-triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Lathe install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Lathe
        2. Perform an action
        3. Lathe crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Lathe version and system specs
      description: |
        Open the command palette in Lathe, then type “zed: copy system specs into clipboard”.
      placeholder: |
        Zed: v1.4.0 (Lathe)
        OS: macOS 15.5
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Lathe log file
      description: |
        Open the command palette in Lathe, then type `zed: open log` to see the last 1000 lines. Or type `zed: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Zed.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
