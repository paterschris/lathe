name: Lathe Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'script/linux'
      - 'script/*linux*'
      - 'script/build-fork*'
      - 'script/package-fork*'
      - 'script/install-fork*'
      - 'script/uninstall*'
      - '.github/workflows/lathe_linux_ci.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CC: clang
  CXX: clang++

jobs:
  check-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          cache-on-failure: true
          shared-key: lathe-linux-check

      - name: Install Linux dependencies
        run: script/linux

      - name: cargo check (full workspace)
        run: cargo check --workspace

  build-linux:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    # Same 20.04 container as release_fork.yml's build-linux so this job
    # validates the exact glibc-2.31 baseline that releases ship with.
    # The image is multi-arch, so the arm runner pulls arm64.
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    needs: check-linux
    steps:
      - name: Install container prerequisites
        run: |
          # archive.ubuntu.com is slow and flaky from GitHub's runners;
          # Azure's mirror is in-network. Retries cover residual blips.
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          echo 'Acquire::Retries "3";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y sudo curl wget git build-essential lsb-release software-properties-common gnupg
          # script/linux runs both as a step below and again inside
          # build-fork-linux; the second run's `gpg --dearmor` hits an
          # overwrite prompt and tries to open /dev/tty, which containers
          # don't have. Configure gpg to answer prompts itself, headless.
          # Container jobs run with HOME=/github/home, so the conf must go
          # there; /root too in case sudo resets HOME.
          mkdir -p "$HOME/.gnupg" /root/.gnupg
          chmod 700 "$HOME/.gnupg" /root/.gnupg
          printf 'no-tty\nyes\n' | tee "$HOME/.gnupg/gpg.conf" > /root/.gnupg/gpg.conf
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          bash /tmp/llvm.sh 18
          ln -sf "$(command -v clang-18)" /usr/local/bin/clang
          ln -sf "$(command -v clang++-18)" /usr/local/bin/clang++
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          # build-fork-linux links with -fuse-ld=lld on aarch64 (libwebrtc);
          # llvm.sh installs ld.lld-18 but clang looks for bare `ld.lld`.
          if command -v ld.lld-18 >/dev/null; then ln -sf "$(command -v ld.lld-18)" /usr/local/bin/ld.lld; fi
          # focal's cmake 3.16 predates file(CONFIGURE ...), which
          # wasmtime-c-api's build requires (cmake >= 3.19). Kitware's
          # portable binary runs on any glibc >= 2.17; its arch names
          # match uname -m (linux-x86_64 / linux-aarch64).
          apt-get install -y ninja-build
          machine_arch=$(uname -m)
          wget -qO /tmp/cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-${machine_arch}.tar.gz"
          tar -xzf /tmp/cmake.tar.gz -C /opt
          ln -sf "/opt/cmake-3.30.5-linux-${machine_arch}/bin/cmake" /usr/local/bin/cmake
          cmake --version | head -1

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          cache-on-failure: true
          shared-key: lathe-linux-glibc231-${{ matrix.arch }}

      - name: Install Linux dependencies
        run: script/linux

      - name: Build
        env:
          # Same env as release_fork.yml's build so CI artifacts are
          # release-grade and can be uploaded to a release directly.
          LATHE_UPDATE_URL: https://api.github.com/repos/paterschris/lathe/releases?per_page=30
          ZED_COMMIT_SHA: ${{ github.sha }}
        run: script/build-fork-linux

      - name: Package
        run: script/package-fork-linux

      - name: Smoke-test install script
        # Container jobs default to `sh` (dash), which silently breaks the
        # $(<file) bashism below; runner-direct jobs default to bash.
        shell: bash
        env:
          # Container jobs run as root; the cli refuses root otherwise.
          ZED_ALLOW_ROOT: "true"
        run: |
          smoke_home="$RUNNER_TEMP/lathe-home"
          mkdir -p "$smoke_home"
          export HOME="$smoke_home"
          export PATH="$HOME/.local/bin:$PATH"

          script/install-fork-linux

          channel=$(<crates/zed/RELEASE_CHANNEL)
          suffix=""
          if [ "$channel" != "stable" ]; then
            suffix="-$channel"
          fi

          case "$channel" in
            stable) app_id="dev.lathe.lathe" ;;
            preview) app_id="dev.lathe.lathe-Preview" ;;
            beta) app_id="dev.lathe.lathe-Beta" ;;
            nightly) app_id="dev.lathe.lathe-Nightly" ;;
            *) app_id="dev.lathe.lathe-Dev" ;;
          esac

          install_dir="$HOME/.local/share/lathe${suffix}"
          cli="$HOME/.local/bin/lathe"
          desktop="$HOME/.local/share/applications/${app_id}.desktop"

          test -x "$install_dir/bin/lathe"
          test -x "$install_dir/libexec/lathe-editor"
          test -L "$cli"
          test "$(readlink -f "$cli")" = "$install_dir/bin/lathe"
          test "$(command -v lathe)" = "$cli"
          test -f "$desktop"
          grep -Fq "Exec=$install_dir/bin/lathe" "$desktop"

          # Launch through the cli: exercises editor-binary discovery (the
          # path every desktop-entry/PATH launch takes), no display needed.
          "$cli" --version

          printf '\n' | ZED_CHANNEL="$channel" sh script/uninstall.sh

          test ! -e "$install_dir"
          test ! -e "$cli"
          test ! -e "$desktop"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: lathe-linux-ci-${{ matrix.arch }}
          path: target/release/Lathe-*-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
